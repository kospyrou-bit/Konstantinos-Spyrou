<!DOCTYPE html>
<html lang="en">
.stats {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin: 40px 0;
}

.stat-box {
    text-align: center;
}

.stat-box h3 {
    font-size: 3rem;
    color: #003B7A;
    margin: 0;
}

.stat-box p {
    font-size: 1.1rem;
    margin-top: 10px;
}
    
<head>
    <title>Research</title>

    <style>
        .stats {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin: 40px 0;
        }

        .stat-box {
            text-align: center;
        }

        .stat-box h3 {
            font-size: 3rem;
            color: #003B7A;
            margin: 0;
        }

        .stat-box p {
            font-size: 1.1rem;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <h2>Research Overview</h2>

    <div class="stats">
        <div class="stat-box">
            <h3 class="counter" data-target="42">0</h3>
            <p>Publications</p>
        </div>

        <div class="stat-box">
            <h3 class="counter" data-target="13">0</h3>
            <p>H-index</p>
        </div>
    </div>

    <script>
        const counters = document.querySelectorAll('.counter');

        counters.forEach(counter => {
            const target = Number(counter.dataset.target);
            let count = 0;

            const updateCounter = () => {
                const increment = Math.max(1, target / 100);

                if (count < target) {
                    count += increment;
                    counter.textContent = Math.min(Math.ceil(count), target);
                    requestAnimationFrame(updateCounter);
                }
            };

            updateCounter();
        });
    </script>

</body>

</html>
