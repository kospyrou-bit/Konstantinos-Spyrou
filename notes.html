<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes | Konstantinos Spyrou</title>
    <meta name="description" content="Opinion notes, research ideas and reflections on sport science, training load and research methods by Konstantinos Spyrou.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #003B7A;
            --blue: #1f6feb;
            --ink: #1d2733;
            --muted: #5b6673;
            --line: #dfe5ec;
            --tint: #f4f7fb;
            --serif: "Newsreader", Georgia, "Times New Roman", serif;
            --sans: "Source Sans 3", "Segoe UI", Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; scroll-padding-top: 80px; }

        body {
            margin: 0;
            font-family: var(--sans);
            font-size: 18px;
            line-height: 1.65;
            color: var(--ink);
            background: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a { color: var(--navy); }

        a:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 3px;
            border-radius: 4px;
        }

        .wrap {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 28px;
        }

        /* Top navigation */
        .site-nav {
            border-bottom: 1px solid var(--line);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .site-nav .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .brand {
            font-family: var(--serif);
            font-weight: 600;
            font-size: 1.15rem;
            text-decoration: none;
            color: var(--navy);
        }

        .nav-links {
            display: flex;
            gap: 8px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            display: block;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            color: var(--muted);
        }

        .nav-links a:hover,
        .nav-links a[aria-current="page"] {
            color: var(--navy);
            background: var(--tint);
        }

        /* Page heading */
        .page-head {
            background: linear-gradient(180deg, var(--tint), #fff);
            padding: 56px 0 40px;
        }

        h1 {
            font-family: var(--serif);
            font-weight: 600;
            font-size: clamp(2.2rem, 5vw, 3rem);
            line-height: 1.1;
            margin: 0 0 12px;
            color: var(--navy);
        }

        .lead {
            margin: 0;
            max-width: 62ch;
            color: var(--muted);
            font-size: 1.1rem;
        }

        main { flex: 1; }

        section { padding: 44px 0; }

        /* Category filters */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
        }

        .filters button {
            font-family: var(--sans);
            font-size: 1rem;
            font-weight: 600;
            color: var(--muted);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 16px;
            cursor: pointer;
        }

        .filters button:hover { color: var(--navy); background: var(--tint); }

        .filters button.active {
            background: var(--navy);
            border-color: var(--navy);
            color: #fff;
        }

        .filters button:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 3px;
        }

        /* Note cards */
        .notes-list {
            display: grid;
            gap: 20px;
        }

        .note-card {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 22px 24px;
        }

        .note-card h2 {
            font-family: var(--serif);
            font-weight: 600;
            font-size: 1.35rem;
            color: var(--navy);
            margin: 8px 0 4px;
        }

        .note-card h2 a { text-decoration: none; color: inherit; }
        .note-card h2 a:hover { text-decoration: underline; }

        .note-card p { margin: 0; font-size: 1rem; }

        .note-meta {
            color: var(--muted);
            font-size: .95rem;
            font-weight: 600;
            margin-bottom: 10px !important;
        }

        .tag {
            display: inline-block;
            background: var(--tint);
            color: var(--navy);
            padding: 2px 12px;
            border-radius: 999px;
            font-size: .85rem;
            font-weight: 600;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 28px;
            color: var(--muted);
            font-size: .9rem;
            border-top: 1px solid var(--line);
        }

        /* Mobile */
        @media (max-width: 720px) {
            body { font-size: 17px; }
            .brand { display: none; }
            .site-nav .wrap { justify-content: center; }
            .page-head { padding: 36px 0 28px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>

<nav class="site-nav" aria-label="Main">
    <div class="wrap">
        <a class="brand" href="index.html">Konstantinos Spyrou</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="research.html">Research</a></li>
            <li><a href="notes.html" aria-current="page">Notes</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</nav>

<header class="page-head">
    <div class="wrap">
        <h1>Notes</h1>
        <p class="lead">
            Opinion notes, research ideas and reflections on sport science, training load and research methods.
        </p>
    </div>
</header>

<main>
    <section>
        <div class="wrap">

            <div class="filters">
                <button class="active" data-filter="all">All</button>
                <button data-filter="Opinion">Opinion</button>
                <button data-filter="Research ideas">Research ideas</button>
                <button data-filter="Methods">Methods</button>
            </div>


            </div>

        </div>
    </section>
</main>

<footer>
    &copy; 2026 Konstantinos Spyrou. All rights reserved.
</footer>

<script>
    // Filter notes by category
    const buttons = document.querySelectorAll('.filters button');
    const cards = document.querySelectorAll('.note-card');
    buttons.forEach(b => b.addEventListener('click', () => {
        buttons.forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        cards.forEach(c => {
            c.style.display = (b.dataset.filter === 'all' || c.dataset.category === b.dataset.filter) ? '' : 'none';
        });
    }));
</script>

</body>
</html>
